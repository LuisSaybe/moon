on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/**'

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  build:
    runs-on: "ubuntu-latest"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@master
        with:
          node-version: "24.x"
      - run: docker build -t moon-web .
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  deploy:
    runs-on: "ubuntu-latest"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Inspect OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            core.info(JSON.stringify({
              iss: claims.iss,
              aud: claims.aud,
              sub: claims.sub
            }, null, 2));
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::264241998403:role/github-role-iam-Role-d4wAv2Qywnkg
      - uses: actions/setup-node@master
        with:
          node-version: "24.x"
      - run: npm ci
      - run: npm run build
      - run: aws s3 sync dist s3://mooncowluna.com
      - run: aws cloudfront create-invalidation --distribution-id EXOH28OSNRFRW --paths '/*'
